<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uplift Register - Platform</title>

  <meta
    name="description"
    content="Controlled-access development opportunity intelligence for serious operators across London and the South East."
  />

  <!-- Favicon / site icons -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#f3f3f3" />

  <style>
    :root {
      --bg: #f3f3f3;
      --panel: #ffffff;
      --panel-top: #f7f7f7;
      --text: #111111;
      --muted: #5e5e5e;
      --rule: #dcdcdc;
      --border: #e3e3e3;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.05);
      --radius: 20px;
      --radius-lg: 28px;
      --content-width: 1048px;
      --section-gap: 56px;
      --gold: #c7922f;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    p,
    li {
      font-size: 16px;
      line-height: 1.72;
    }

    main {
      padding: 84px 24px 56px;
    }

    .page-wrap,
    .site-shell,
    .platform-shell,
    .wrap {
      max-width: var(--content-width);
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--rule);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .logo-band,
    .hero-logo,
    .top-logo-block,
    .masthead-art {
      background: var(--panel-top);
      border-bottom: 1px solid var(--rule);
      padding: 30px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-band img,
    .hero-logo img,
    .top-logo-block img,
    .masthead-art img {
      width: min(480px, 100%);
      border-radius: 10px;
    }

    .content,
    .content-wrap,
    .page-content,
    .inner {
      padding: 0 40px 40px;
    }

    .hero,
    .hero-block {
      padding: 44px 0 34px;
      text-align: center;
      border-bottom: 1px solid var(--rule);
    }

    .eyebrow,
    .section-eyebrow,
    .hero-eyebrow {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #666666;
      margin-bottom: 14px;
    }

    h1,
    .hero-title {
      margin: 0 0 18px;
      font-size: clamp(38px, 5vw, 62px);
      line-height: 1.06;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .hero p,
    .hero-copy,
    .hero-support {
      max-width: 860px;
      margin: 0 auto 22px;
      font-size: 18px;
      line-height: 1.72;
      color: var(--muted);
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin: 24px 0 22px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 0 24px;
      border-radius: 999px;
      border: 1.5px solid #111111;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #111111;
      color: #ffffff;
    }

    .btn-secondary {
      background: transparent;
      color: #111111;
    }

    .pill-row,
    .chip-row,
    .hero-pills {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 22px;
    }

    .pill,
    .chip,
    .info-pill {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fafafa;
      padding: 14px 16px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      color: #3f3f3f;
    }

    .section {
      padding: 42px 0;
      border-top: 1px solid var(--rule);
    }

    .section:first-of-type {
      border-top: 0;
    }

    .section h2,
    .section-title {
      margin: 0 0 16px;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .section p,
    .section-intro {
      margin: 0 0 18px;
      color: #2d2d2d;
    }

    .lede,
    .section-lede {
      color: var(--muted);
    }

    .two-up,
    .comparison-grid,
    .card-grid.two-up,
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .card-grid,
    .subscriber-grid,
    .output-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .card,
    .info-card,
    .comparison-card,
    .output-card,
    .subscriber-card {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
    }

    .card h3,
    .info-card h3,
    .comparison-card h3,
    .output-card h3,
    .subscriber-card h3 {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .card p:last-child,
    .info-card p:last-child,
    .comparison-card p:last-child,
    .output-card p:last-child,
    .subscriber-card p:last-child {
      margin-bottom: 0;
    }

    .card ul,
    .comparison-card ul,
    .section ul {
      margin: 0;
      padding-left: 22px;
    }

    .card li + li,
    .comparison-card li + li,
    .section li + li {
      margin-top: 10px;
    }

    .process-grid,
    .step-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 24px;
    }

    .step-card,
    .process-card {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
    }

    .step-number,
    .process-number {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1.5px solid #111111;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .step-card h3,
    .process-card h3 {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .ai-note,
    .doctrine-card,
    .ai-doctrine {
      margin-top: 22px;
      border: 1px solid #111111;
      border-radius: var(--radius);
      background: #fafafa;
      padding: 20px 22px;
    }

    .ai-note h3,
    .doctrine-card h3,
    .ai-doctrine h3 {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .proof-preview,
    .example-preview,
    .preview-proof,
    .proof-showcase {
      margin-top: 24px;
    }

    .proof-shell,
    .proof-card,
    .preview-shell {
      border: 1px solid var(--border);
      border-radius: 24px;
      background: #fbfbfb;
      padding: 24px;
    }

    .proof-intro,
    .proof-copy {
      max-width: 900px;
      margin-bottom: 18px;
    }

    .proof-eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #666666;
    }

    .proof-shell h3,
    .proof-card h3,
    .preview-shell h3 {
      margin: 0 0 12px;
      font-size: clamp(28px, 3.2vw, 40px);
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .proof-shell p,
    .proof-card p,
    .preview-shell p {
      color: #2d2d2d;
    }

    .proof-figure,
    .preview-figure,
    .proof-image-wrap {
      margin: 22px 0 12px;
    }

    .proof-image-frame,
    .preview-image-frame,
    .proof-image-card {
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #ffffff;
      padding: 14px;
      overflow: hidden;
    }

    .proof-image,
    .preview-image,
    .proof-figure img {
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    .proof-caption,
    .preview-caption,
    .caption {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
    }

    .proof-support,
    .proof-support-grid,
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 22px;
    }

    .proof-item,
    .preview-item,
    .support-item {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #ffffff;
      padding: 18px 18px 16px;
    }

    .proof-item h4,
    .preview-item h4,
    .support-item h4 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .proof-item p,
    .preview-item p,
    .support-item p {
      margin: 0;
      font-size: 15px;
      line-height: 1.65;
      color: #3b3b3b;
    }

    .proof-bridge,
    .preview-bridge {
      margin-top: 18px;
      font-size: 16px;
      line-height: 1.72;
      color: #2d2d2d;
    }

    .proof-bridge a,
    .preview-bridge a {
      text-decoration: underline;
      text-underline-offset: 2px;
      font-weight: 700;
    }

    .list-tight {
      margin: 0;
      padding-left: 22px;
    }

    .list-tight li + li {
      margin-top: 10px;
    }

    .cta-block {
      border: 1px solid var(--border);
      border-radius: 24px;
      background: #fafafa;
      padding: 28px 24px;
      text-align: center;
    }

    .cta-block h2 {
      margin-bottom: 14px;
    }

    .cta-block p {
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
      color: #2d2d2d;
    }

    .contact-line {
      margin-top: 16px;
      color: var(--muted);
    }

    .contact-line a {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .footer-note,
    .note-strip {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--rule);
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .footer-nav {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 18px;
      font-size: 15px;
      color: #4a4a4a;
    }

    .footer-nav a {
      text-decoration: none;
    }

    .footer-nav a:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    @media (max-width: 980px) {
      main {
        padding: 56px 18px 36px;
      }

      .content,
      .content-wrap,
      .page-content,
      .inner {
        padding: 0 22px 28px;
      }

      .pill-row,
      .chip-row,
      .hero-pills,
      .two-up,
      .comparison-grid,
      .card-grid,
      .subscriber-grid,
      .output-grid,
      .process-grid,
      .step-grid,
      .proof-support,
      .proof-support-grid,
      .preview-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 760px) {
      .hero,
      .hero-block {
        padding: 34px 0 26px;
      }

      h1,
      .hero-title {
        font-size: 42px;
      }

      .section {
        padding: 34px 0;
      }

      .section h2,
      .section-title {
        font-size: 36px;
      }

      .pill-row,
      .chip-row,
      .hero-pills,
      .two-up,
      .comparison-grid,
      .card-grid,
      .subscriber-grid,
      .output-grid,
      .process-grid,
      .step-grid,
      .proof-support,
      .proof-support-grid,
      .preview-grid {
        grid-template-columns: 1fr;
      }

      .hero-actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .proof-shell,
      .proof-card,
      .preview-shell,
      .cta-block {
        padding: 20px 18px;
      }

      .footer-nav {
        gap: 12px 16px;
      }
    }

    @media (max-width: 520px) {
      main {
        padding: 42px 14px 28px;
      }

      .logo-band,
      .hero-logo,
      .top-logo-block,
      .masthead-art {
        padding: 20px 14px;
      }

      .content,
      .content-wrap,
      .page-content,
      .inner {
        padding: 0 16px 22px;
      }

      h1,
      .hero-title {
        font-size: 34px;
      }

      .section h2,
      .section-title {
        font-size: 30px;
      }

      .hero p,
      .hero-copy,
      .hero-support,
      .section p,
      .section-intro,
      p,
      li {
        font-size: 15px;
      }

      .eyebrow,
      .section-eyebrow,
      .hero-eyebrow,
      .proof-eyebrow {
        font-size: 12px;
        letter-spacing: 0.16em;
      }
    }
  </style>
